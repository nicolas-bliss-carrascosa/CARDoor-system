{% extends 'base.html' %}
{% block title %}Dashboard{% endblock title %}
{% block content %}
<div class="container">
    <div class="row my-4">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        Interactions
                    </div>
                    {{interactions|length}} interactions reported today
                </div>
            </div>
        </div>
        <div class="col">
                        <div class="card">
                <div class="card-body">
                    <div class="card-title">
                        Alerts
                    </div>
                    {{alerts|length}} alerts reported today
                </div>
            </div>
        </div>
    </div>
    <div class="row my-4">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    {{div|safe}}
                </div>
            </div>
        </div>
    </div>
</div>
{{script|safe}}
{% endblock content %}
